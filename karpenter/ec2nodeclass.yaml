apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  role: KARPENTER_NODE_ROLE_PLACEHOLDER
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: fp-eks
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: fp-eks
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 30Gi
        volumeType: gp3
        encrypted: true
