apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-datasource
  namespace: {{ .Values.namespace }}
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: {{ .Values.grafana.datasourceUrl }}
        isDefault: true
        editable: false
