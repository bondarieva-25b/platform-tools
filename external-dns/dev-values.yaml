serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::058316962389:role/fp-eks-external-dns-role

provider: 
  name: aws
policy: sync

sources:
  - ingress

domainFilters:
  - team312.com

annotationFilter: "external-dns.alpha.kubernetes.io/hostname"

txtOwnerId: fp-eks

logLevel: debug
logFormat: text
interval: 1m
registry: txt

image:
  pullPolicy: IfNotPresent

serviceMonitor:
  enabled: false

secretConfiguration:
  enabled: false
  data: {}

deploymentStrategy:
  type: Recreate

automountServiceAccountToken: true
shareProcessNamespace: false

rbac:
  create: true

service:
  port: 7979

podSecurityContext:
  runAsNonRoot: true
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

securityContext:
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop: ["ALL"]

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 2
  successThreshold: 1

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1
