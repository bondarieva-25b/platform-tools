apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: flux-system
spec:
  interval: 10m
  releaseName: external-dns
  targetNamespace: external-dns
  install:
    createNamespace: true
  chart:
    spec:
      chart: ./external-dns
      sourceRef:
        kind: GitRepository
        name: platform-tools
      interval: 5m
  values:
    serviceAccount:
      annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::058316962389:role/fp-eks-external-dns-role
    provider:
      name: aws
    policy: sync
    sources:
      - ingress
    domainFilters:
      - team312.com
    annotationFilter: "external-dns.alpha.kubernetes.io/hostname"
    txtOwnerId: fp-eks
    logLevel: debug   
