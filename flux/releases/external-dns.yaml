apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: flux-system
spec:
  interval: 10m
  releaseName: external-dns
  targetNamespace: external-dns
  install:
    createNamespace: true
  chart:
    spec:
      chart: ./external-dns
      sourceRef:
        kind: GitRepository
        name: platform-tools
      interval: 5m
      valuesFiles:
        - ./external-dns/dev-values.yaml
